server:
  port: 8082

spring:
  application:
    name: ticketsystem
  datasource:
    url: jdbc:postgresql://localhost:5434/tickets
    username: tickets
    password: tickets
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Schema kommt ausschließlich aus den Flyway-Migrationen
  threads:
    virtual:
      enabled: true

tickets:
  # Legt beim ersten Start Demo-Benutzer an (Passwort jeweils "demo123"). Nur für lokale Tests!
  demo-users: true

management:
  endpoints:
    web:
      exposure:
        include: health
